        color: #ffffff;
        border: none;

        transition: background-color 0.3s, transform 0.2s;

		<button id="drawCurve">曲线</button>
		<button id="drawEllipse">椭圆</button>
		<button id="drawLune">半月面</button>
		<button id="hide">隐藏</button>
		<button id="show">显示</button>
		<button id="startGrowthAnimation">生长动画</button>
	</div>

  const dragStartHandler = () => {

  const drawUpdateHandler = (cartesian) => {
    console.error('update', cartesian);
  };

  const drawEndHandler = (geometryPoints) => {
    console.error('drawEnd', geometryPoints);
  };

  const editStartHandler = () => {
    console.error('editStart');
  };

  const editEndHandler = (geometryPoints) => {
    console.error('editEnd', geometryPoints);
  };
  const buttonGroup = document.getElementById('button-group');
  buttonGroup.onclick = (evt) => {
    const targetElement = evt.target;
    switch (targetElement.id) {
      case 'drawCircle':
        geometry = new ThreePlot.Circle(viewer);
        break;
      case 'drawPolygon':
        geometry = new ThreePlot.Polygon( viewer);
        break;
      case 'drawReactangle':
        geometry = new ThreePlot.Reactangle(viewer);
        break;
      case 'drawTriangle':
        geometry = new ThreePlot.Triangle(viewer);
        break;
      case 'drawFineArrow':
        geometry = new ThreePlot.FineArrow(viewer, {
          // material: Cesium.Color.fromCssColorString('rgba(59, 178, 208, 0.5)'),

        });
        break;
      case 'drawAttackArrow':
        geometry = new ThreePlot.AttackArrow(viewer, {

        });

      case 'drawSwallowtailAttackArrow':
        geometry = new ThreePlot.SwallowtailAttackArrow(viewer, {

        });

      case 'drawSquadCombat':
        geometry = new ThreePlot.SquadCombat( viewer, {

        });

        geometry = new ThreePlot.StraightArrow(viewer, {

        });

      case 'drawAssaultDirection':
        geometry = new ThreePlot.AssaultDirection(viewer);

      case 'drawCurvedArrow':
        geometry = new ThreePlot.CurvedArrow( viewer, {
          // material: Cesium.Color.BLUE,
        });
        break;
      case 'drawDoubleArrow':
        geometry = new ThreePlot.DoubleArrow(viewer, {
          // outlineMaterial: Cesium.Color.GREEN,
        });
        break;
      case 'drawFreehandLine':
        geometry = new ThreePlot.FreehandLine(viewer);
        break;
      case 'drawCurve':
        geometry = new ThreePlot.Curve( viewer);
        break;
      case 'drawEllipse':
        geometry = new ThreePlot.Ellipse(viewer);
        break;
      case 'drawLune':
        geometry = new ThreePlot.Lune(viewer);
        break;
      case 'drawFreehandPolygon':
        geometry = new ThreePlot.FreehandPolygon(viewer, {
          // material: Cesium.Color.GREEN,
          // outlineMaterial: Cesium.Color.fromCssColorString('rgba(59, 178, 208, 1)'),
          // outlineWidth: 2,
        });
        break;
      case 'hide':
        geometry &&
          geometry.hide({
            deration: 2000,
          });
        break;
      case 'show':
        geometry &&
          geometry.show({
            deration: 2000,
          });
        break;
      case 'remove':
        geometry && geometry.remove();
        geometry = null;
        break;
      case 'addEvent':
        if (geometry) {
          geometry.on('drawStart', dragStartHandler);
          geometry.on('drawUpdate', drawUpdateHandler);
          geometry.on('drawEnd', drawEndHandler);
          geometry.on('editStart', editStartHandler);
          geometry.on('editEnd', editEndHandler);
        }
        break;
      case 'removeEvent':
        if (geometry) {
          geometry.off('drawStart', dragStartHandler);
          geometry.off('drawUpdate', drawUpdateHandler);
          geometry.off('drawEnd', drawEndHandler);
          geometry.off('editStart', editStartHandler);
          geometry.off('editEnd', editEndHandler);
        }
        break;
      case 'startGrowthAnimation':
        if (geometry) {
          geometry.startGrowthAnimation({
            duration: 2000,
          });
        }
        break;
      default:
        break;
    }
  };
